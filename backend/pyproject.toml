[project]
name = "workflowarchitect-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.2",
    "uvicorn[standard]==0.30.6",
    "pydantic>=2.10.5,<3.0.0",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
    "datapizza-ai==0.0.9",
    "datapizza-ai-clients-openai==0.0.9",
]

[dependency-groups]
dev = [
    "ruff==0.6.7",
    "mypy>=1.11.0",
    "bandit==1.7.9",
    "pytest==8.3.3",
    "pytest-asyncio",
    "httpx==0.27.2",
    "pytest-cov",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "ARG"]

ignore = [
    "B008", # Permette l'uso di Depends() nelle signature di FastAPI
]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
strict = true
ignore_missing_imports = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
