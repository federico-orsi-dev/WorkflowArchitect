name: CI-Quality-Gate

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop, master, main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  WORKDIR: backend

jobs:
  quality-gate:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Fondamentale: usiamo il lockfile per un caching deterministico
          cache-dependency-glob: "${{ env.WORKDIR }}/uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        # 'uv sync' è più veloce e pulito di 'uv pip install'
        run: uv sync --all-groups

      - name: Static Analysis (Lint, Format, Typing)
        # Usiamo 'uv run' per garantire l'isolamento dell'ambiente
        run: |
          uv run ruff check . --output-format=github
          uv run ruff format --check .
          uv run mypy . --ignore-missing-imports

      - name: Security Scan
        # Escludiamo .venv esplicitamente per evitare loop infiniti
        run: uv run bandit -r . -x .venv,tests -ll

      - name: Unit & Integration Tests
        env:
          OPENAI_API_KEY: "sk-mock-123"
        run: uv run pytest -q